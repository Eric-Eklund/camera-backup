# camera-backup configuration template.
# Copy this file to config.toml next to the binary (or pass --config <path>)
# and adjust the paths for your system. config.toml is gitignored — your
# local paths stay out of version control.
#
# Everything here can also be edited from the TUI: press `c` for the settings
# screen, `s` to save. It rewrites values in place and leaves these comments
# alone, so editing by hand and editing in the TUI are interchangeable.

# Camera / memory card (mount point). Run `camera-backup devices` to list what
# is mounted right now, or press `d` in the TUI to pick a device from that list
# — either beats guessing where udisks put the card.
source = "/run/media/user/CAMERA-CARD"

# Additional source devices, tried in order when `source` is not mounted
# (optional) — e.g. a second card reader or an external SSD. Whichever one is
# plugged in becomes the source, so one config serves them all.
#extra_sources = ["/run/media/user/EXT-SSD"]

# Dump straight from the source device to the NAS, skipping the local SSD
# (optional, default false). With this on, `copy` and the TUI's [y] copy the
# card or external drive directly to the NAS — always SHA256-verified, since
# the NAS copy is then the only copy. The `dump` command does the same thing
# on demand without this setting. Requires nas_photos/nas_videos; the
# ssd_* keys become optional (and `sync` still works if you keep them).
#direct_to_nas = false

# Destination roots — one per category. Point photos and videos at the same
# path to merge them into one tree.
ssd_photos = "/mnt/ssd/Photos" # Local SSD destination for photos
ssd_videos = "/mnt/ssd/Videos" # Local SSD destination for videos
nas_photos = "/mnt/nas/Photos" # NAS photos (SMB/NFS, or WireGuard VPN) — optional, set both or neither
nas_videos = "/mnt/nas/Videos" # NAS videos

file_extensions = [".MOV", ".NEF", ".JPG", ".MP4"]

video_extensions = [".MOV", ".MP4"] # these route to the videos destination; everything else goes to photos

# Parallel copy workers used by the TUI (optional)
#ssd_workers = 3 # camera → SSD (default 3)
#nas_workers = 1 # SSD → NAS   (default 1)

# Per-file write timeout for SSD → NAS copies (optional, default 60) —
# guards against hung network mounts; see "Recommended NAS mount options" in README
#nas_write_timeout_seconds = 60

# How the TUI's Info panel draws the focused photograph (optional):
#   "auto"   — a real image in terminals that speak the Kitty graphics protocol
#              (Kitty, Ghostty), ANSI block art everywhere else (default)
#   "kitty"  — ask for the protocol even where detection says no (inside tmux
#              with allow-passthrough turned on, for instance)
#   "blocks" — always block art: one pixel per terminal column
#   "off"    — no preview, just the file's details
#list_preview = "auto"

# SSD → NAS transfer order (optional): "videos-first" (default) or "size-asc"
# (smallest files first — best on flaky connections); used by the TUI and as
# the default for `sync --order`
#nas_sync_order = "videos-first"
